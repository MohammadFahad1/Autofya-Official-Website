services:
  db:
    image: postgres:16-alpine
    container_name: autofya-db
    restart: unless-stopped
    command: ["postgres", "-p", "9013"]
    environment:
      POSTGRES_DB: autofya_db
      POSTGRES_USER: autofya_user
      POSTGRES_PASSWORD: autofya_password
      PGPORT: 9013
    ports:
      - "9013:9013"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -p 9013 -U autofya_user -d autofya_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: autofya-redis
    restart: unless-stopped
    command: ["redis-server", "--port", "6380"]
    ports:
      - "6380:6380"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6380", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: autofya-backend
    restart: unless-stopped
    ports:
      - "8011:8011"
    env_file:
      - ./backend/.env
    environment:
      - PORT=8011
      - POSTGRES_HOST=db
      - POSTGRES_PORT=9013
      - POSTGRES_DB=autofya_db
      - POSTGRES_USER=autofya_user
      - POSTGRES_PASSWORD=autofya_password
      - CELERY_BROKER_URL=redis://redis:6380/0
      - CELERY_RESULT_BACKEND=redis://redis:6380/0
      - CELERY_TASK_ALWAYS_EAGER=False
      - MEDIA_ROOT=/app/media
      - BACKEND_URL=${BACKEND_URL:-https://api.autofya.com}
    volumes:
      - autofya_media:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: autofya-celery
    restart: unless-stopped
    command: celery -A autofya worker -l info
    env_file:
      - ./backend/.env
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_PORT=9013
      - POSTGRES_DB=autofya_db
      - POSTGRES_USER=autofya_user
      - POSTGRES_PASSWORD=autofya_password
      - CELERY_BROKER_URL=redis://redis:6380/0
      - CELERY_RESULT_BACKEND=redis://redis:6380/0
      - CELERY_TASK_ALWAYS_EAGER=False
      - MEDIA_ROOT=/app/media
      - BACKEND_URL=${BACKEND_URL:-https://api.autofya.com}
    volumes:
      - autofya_media:/app/media
    depends_on:
      backend:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.autofya.com}
    container_name: autofya-frontend
    restart: unless-stopped
    ports:
      - "8012:8012"
    environment:
      - PORT=8012
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://api.autofya.com}
    depends_on:
      - backend

volumes:
  postgres_data:
    name: postgres_data
  redis_data:
    name: redis_data
  autofya_media:
    name: autofya_media
